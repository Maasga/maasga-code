name: mobile_admin
description: "MaasGa Admin - Panel d'administration mobile"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^3.0.0
  
  # Router
  go_router: ^14.0.0
  
  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  
  # Réseau
  dio: ^5.0.0
  cookie_jar: ^4.0.0
  
  # Stockage local
  shared_preferences: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  
  # UI
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.0
  
  # Utils
  connectivity_plus: ^6.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.0.0
  
  # Charts
  fl_chart: ^0.68.0
  
  # Image handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
