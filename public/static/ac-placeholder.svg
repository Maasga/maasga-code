<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Background panel -->
  <rect x="20" y="50" width="200" height="80" rx="12" fill="url(#bgGrad)" stroke="#0077b6" stroke-width="1.5"/>
  <!-- Top gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="20" y1="50" x2="220" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="ventGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
  </defs>
  <!-- AC body highlight -->
  <rect x="20" y="50" width="200" height="16" rx="12" fill="rgba(255,255,255,0.5)"/>
  <!-- Display panel -->
  <rect x="150" y="62" width="55" height="26" rx="6" fill="rgba(3,4,94,0.08)" stroke="rgba(0,119,182,0.2)" stroke-width="1"/>
  <!-- Digital display dots -->
  <circle cx="163" cy="75" r="3" fill="#0077b6" opacity="0.7"/>
  <circle cx="174" cy="75" r="3" fill="#0077b6" opacity="0.7"/>
  <circle cx="185" cy="75" r="3" fill="#03045e" opacity="0.5"/>
  <circle cx="196" cy="75" r="3" fill="#03045e" opacity="0.3"/>
  <!-- Power button -->
  <circle cx="176" cy="83" r="5" fill="rgba(0,119,182,0.15)" stroke="#0077b6" stroke-width="1"/>
  <path d="M176 80v3" stroke="#0077b6" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M173 81a4 4 0 1 0 6 0" stroke="#0077b6" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Vent slats -->
  <rect x="30" y="102" width="170" height="4" rx="2" fill="url(#ventGrad)" opacity="0.7"/>
  <rect x="30" y="110" width="170" height="4" rx="2" fill="url(#ventGrad)" opacity="0.5"/>
  <rect x="30" y="118" width="170" height="4" rx="2" fill="url(#ventGrad)" opacity="0.35"/>
  <!-- Left vent slat (vertical divider) -->
  <rect x="25" y="65" width="115" height="3" rx="1.5" fill="rgba(0,119,182,0.2)"/>
  <!-- Brand label area -->
  <text x="80" y="80" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#03045e" text-anchor="middle" letter-spacing="2">MAASGA</text>
  <text x="80" y="93" font-family="Inter, Arial, sans-serif" font-size="7" fill="#0077b6" text-anchor="middle" letter-spacing="1" opacity="0.8">CLIMATISEUR</text>
  <!-- Air snowflake icon -->
  <g transform="translate(110, 155)" opacity="0.5">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#0077b6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#0077b6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5" stroke="#0077b6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8.5" y1="-8.5" x2="-8.5" y2="8.5" stroke="#0077b6" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#0077b6"/>
  </g>
  <!-- Air flow lines -->
  <path d="M 50 145 Q 70 138 90 145" stroke="#0077b6" stroke-width="1" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M 110 143 Q 130 136 150 143" stroke="#0077b6" stroke-width="1" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M 155 147 Q 175 140 195 147" stroke="#0077b6" stroke-width="1" fill="none" opacity="0.15" stroke-linecap="round"/>
  <!-- Mounting brackets -->
  <rect x="30" y="44" width="20" height="8" rx="3" fill="#0077b6" opacity="0.3"/>
  <rect x="190" y="44" width="20" height="8" rx="3" fill="#0077b6" opacity="0.3"/>
</svg>
