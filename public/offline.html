<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Hors connexion — MAASGA</title>
  <style>
    :root { --navy: #03045e; --accent: #0369a1; --muted: #475569; --bg: #f8fbff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--navy); }
    main { max-width: 420px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.5rem; margin: 20px 0 8px; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 24px; }
    .actions { display: grid; gap: 12px; }
    a, button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px;
      border-radius: 14px; font: 600 1rem/1 inherit; text-decoration: none; border: 0; cursor: pointer; }
    .primary { background: var(--accent); color: #fff; }
    .wa { background: #075E54; color: #fff; }
    .ghost { background: #fff; color: var(--navy); border: 1.5px solid rgba(3,4,94,.15); }
    a:focus-visible, button:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/logo-site.webp" alt="MAASGA" width="72" height="72" />
    <h1>Vous êtes hors connexion</h1>
    <p>Cette page n’est pas disponible sans réseau. Vous pouvez nous joindre directement par téléphone ou WhatsApp : nous répondons 7j/7, de 8h à 18h.</p>
    <div class="actions">
      <a class="primary" href="tel:+22655996418">Appeler le +226 55 99 64 18</a>
      <a class="wa" href="https://wa.me/22655996418">Écrire sur WhatsApp</a>
      <button class="ghost" type="button" onclick="location.reload()">Réessayer</button>
    </div>
  </main>
</body>
</html>
